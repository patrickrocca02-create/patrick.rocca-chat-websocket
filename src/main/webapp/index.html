<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="dataManager.js"></script>
    <script src="client.js"></script>
</head>
<body>
    Crea gruppo:
    <input type="text" name="groupName" id="groupNameInput"/>
    <input type="text" name="groupMembers" id="groupMembersInput"/>
    <input type="button" value="invia" onclick="{
        name = document.getElementById('groupNameInput').value;
        members = document.getElementById('groupMembersInput').value.split(',');
        sendNewGroup(new Group(name, members));
    }"/>
    <br>
    Invia a utente:
    <input type="text" name="text1" id="textInput1"/>
    <input type="text" name="userName" id="userNameInput"/>
    <input type="button" value="invia" onclick="{
        text = document.getElementById('textInput1').value;
        destUser = document.getElementById('userNameInput').value;
        sendUserMessage(new Message(text), destUser);
    }"/>
    <br>
    Invia a gruppo:
    <input type="text" name="text2" id="textInput2"/>
    <input type="text" name="groupName1" id="groupNameInput2"/>
    <input type="button" value="invia" onclick="{
        text = document.getElementById('textInput2').value;
        dest = document.getElementById('groupNameInput2').value;
        sendGroupMessage(new Message(text), dest);
    }"/>
</body>
</html>
